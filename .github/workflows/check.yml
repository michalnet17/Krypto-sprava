# Kontrola sestavení APK na vedlejších větvích (nic se nevydává).
name: Check
on:
  push:
    branches-ignore: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: APK (debug)
        run: |
          mkdir -p android/app/src/main/assets && cp -r web android/app/src/main/assets/web
          gradle -p android --no-daemon :app:assembleDebug
