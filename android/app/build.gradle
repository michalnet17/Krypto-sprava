plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.adadane.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cz.adadane.app'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '0.3.3'
    }

    // podpis release APK: klíč z proměnných prostředí (GitHub Actions secrets); bez nich se podepíše debug klíčem
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS')
                keyPassword System.getenv('KS_KEY_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
